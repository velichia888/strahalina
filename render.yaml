# Render only allows one free-tier Postgres database per account, and
# myemptycloset-db/carhopping-db already use it — this service uses a
# free Neon Postgres database instead of Render's own `databases:`
# provisioning. DATABASE_URL/DIRECT_URL are entered by hand in the
# Render dashboard (sync: false) from Neon's connection strings (pooled
# for DATABASE_URL, direct/unpooled for DIRECT_URL — Prisma migrate
# needs the unpooled one). Same workaround as Car Hopping.
services:
  - type: web
    name: strahalina-backend
    runtime: node
    rootDir: backend
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: CORS_ORIGIN
        value: "*"
      - key: STORAGE_PROVIDER
        value: local
      - key: LOCAL_STORAGE_SIGNING_SECRET
        generateValue: true
