# NOTE: not deployed yet (per this pass's scope) — written for when the
# user greenlights deployment. Render only allows one free-tier Postgres
# per account, and myemptycloset-db/carhopping already use it — this
# databases: block will almost certainly hit that limit. When actually
# deploying, switch to a free Neon Postgres and sync: false env vars for
# DATABASE_URL/DIRECT_URL, same workaround used for Car Hopping.
databases:
  - name: strahalina-db
    plan: free
    databaseName: strahalina
    user: strahalina

services:
  - type: web
    name: strahalina-backend
    runtime: node
    rootDir: backend
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: strahalina-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: strahalina-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: CORS_ORIGIN
        value: "*"
      - key: STORAGE_PROVIDER
        value: local
      - key: LOCAL_STORAGE_SIGNING_SECRET
        generateValue: true
